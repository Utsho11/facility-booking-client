<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E40"/>
      <stop offset="40%" stop-color="#FE7D1F"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="auraShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FE7D1F" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Brand Shield / Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#auraGrad)" filter="url(#auraShadow)"/>
  
  <!-- Dynamic Athletic Lightning Bolt & Court Lines -->
  <!-- Court Center Ring Accent -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 2"/>
  
  <!-- Bold Lightning Zap Icon -->
  <path d="M35 12 L19 33 L30 33 L26 52 L45 28 L33 28 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
